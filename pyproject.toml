[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-guard"
version = "0.1.0"
description = "Estimate prompt token cost and flag expensive LLM inputs locally."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "alexzhu0" }]
keywords = ["ai-tools", "llmops", "cost", "cli", "developer-tools", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development"
]

[project.scripts]
llm-cost-guard = "llm_cost_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
